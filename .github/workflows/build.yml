# Rebuilds the site and print PDF whenever content changes (e.g. a PTF edits a tips file).
name: Build and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml jinja2 qrcode
      - run: python build.py
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm i playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node pdf.js
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
