module:
  id: hx
  order: 1
  title: Case history and otoscopy
  owner: ""
  source: "1–3"

cards:

- id: HX-01
  title: Run the case history interview
  mode: DO-CONFIRM
  source: "1, 2.1"
  purpose: Build rapport and get an accurate history that shapes the rest of the appointment.
  when:
    - Test only in rooms that meet ambient noise standards, with calibrated, maintained equipment (NZAS Professional Practice Standards, Part A).
  blocks:
    - title: Open the interview
      steps:
        - do: Give your full name and say why you are asking questions.
          ask: "Hi, I'm Sam, a student audiologist. I'll start by asking about your hearing, so we can plan today's tests."
          why: Patients answer more openly when they know who you are and why the questions matter.
        - do: Choose seating and lighting that help communication.
          why: Good light on your face supports lip-reading, which many of our patients rely on.
    - title: Ask well
      steps:
        - do: Mix open and closed questions in a sensible order.
          ask: ["Tell me about your hearing.", "Which ear do you feel hears better?"]
          why: Open questions get the patient's story and priorities; closed questions then pin down the details.
        - do: Avoid leading questions and asking several questions at once.
          ask: "Which ear do you feel hears better?"
          why: "\"Your hearing is worse on the left, isn't it?\" invites agreement, not information. Asking two things at once gets an answer to only one."
        - do: Use plain words. Say "ringing in your ears", not "tinnitus".
          ask: "Do you ever hear ringing, buzzing or other noises in your ears?"
        - do: Check the patient can hear you. Adjust your volume, clarity and speed.
          why: If they mishear your questions, the history is unreliable. How they cope is also your first informal hearing check.
    - title: Communicate
      steps:
        - Use open body posture and keep eye contact.
        - Avoid unconscious mannerisms.
        - Be courteous and show you understand their hearing difficulties.
    - title: Structure the interview
      steps:
        - Keep the patient on track.
        - do: Encourage talk with silence, minimal encouragers and reflections.
          ask: "So it's mostly in noisy restaurants that you struggle?"
          why: A reflection shows you listened and lets the patient correct or add to what you understood.
        - Pick up on verbal and non-verbal cues.
        - Close the interview clearly before testing.
  sim:
    name: history-taking simulator
    url: https://jakalnz.github.io/history-taking-simulator/
    label: Practise an adult case history with a simulated patient
  check:
    - q: Rewrite as a non-leading question - "You don't get dizzy, do you?"
      a: "For example: \"Have you had any dizziness or problems with your balance?\""
  fixes:
    - "Section 1 (standards) folded into this card as a one-line reminder."

- id: HX-02
  title: Take the adult history
  mode: DO-CONFIRM
  source: "2.2, 2.3"
  purpose: Gather the history you need to form a hypothesis before you test.
  blocks:
    - title: Gather
      steps:
        - Order questions logically.
        - Follow up on areas that may give diagnostic clues.
        - Record all relevant answers clearly on the UoA Adult History Form.
        - Cover every section of the form below.
      why: Ordering questions and following up on clues is hypothesis-forming. By the end of the history you should be able to predict what the audiogram will show, and notice when it does not.
    - title: Adult History Form sections
      side: true
      layout: table
      steps:
        - do: "Reason for appointment: referral source and main concern."
          ask: ["What brings you in today?", "Whose idea was it to have your hearing checked?"]
          why: "The main concern sets the goal of the appointment. If family or a GP prompted the visit, the patient may notice less difficulty than others do."
        - do: "Hearing: concerns, better ear, onset (gradual or sudden), sound sensitivity, previous tests or aids."
          ask: ["Which ear do you feel hears better?", "Did it come on gradually, or did you notice it suddenly?", "Have you had a hearing test or worn hearing aids before?"]
          why: "A sudden loss points to an acute insult to the cochlea or nerve (viral, vascular or inflammatory). Hair cells and their blood supply may recover if treatment starts early, so it needs urgent referral (CLS-02). The better ear is tested first, and earlier results show whether the loss is progressing."
        - do: "Tinnitus: side, description, onset, constant, intermittent or pulsatile, annoyance."
          ask: ["Do you hear ringing, buzzing or other sounds in your ears or head?", "Is it in one ear, both, or in your head?", "Does it ever beat in time with your heartbeat?", "How much does it bother you?"]
          why: "Most tinnitus follows reduced input from a damaged cochlea, which the brain compensates for by turning up its own activity. Tinnitus in one ear needs a one-sided cause, which can include a vestibular schwannoma pressing on that ear's nerve, so it is an NZ referral criterion. Pulsatile tinnitus is usually the sound of turbulent blood flow in a vessel near the ear, or a vascular tumour, and needs medical review. How much it bothers them guides management."
        - do: "Vertigo, dizziness or imbalance: onset, trigger, type, duration, recent falls, GP aware."
          ask: ["Have you had any dizziness, spinning or unsteadiness?", "What were you doing when it started, and how long does it last?", "Have you had any falls in the last year?"]
          why: "Vertigo comes from a mismatch between the balance signals of the two inner ears, or from the brain that integrates them. Attacks of 20 minutes to hours with fluctuating low-frequency loss, roaring tinnitus and fullness fit Ménière's disease (excess endolymph). Brief spins when rolling over fit BPPV. Dizziness with double vision, slurred speech, numbness or weakness may be a brainstem or cerebellar stroke: call 111. Falls risk changes urgency and onward referral."
        - do: "General ear health: pain, discharge, fullness, wax."
          ask: ["Any ear pain, discharge or a blocked feeling?", "Do you use cotton buds, or have your ears cleaned?"]
          why: "Pain and discharge usually mean infection of the canal skin (otitis externa) or of the middle ear through a perforation. Inflamed skin is fragile and infection can spread on equipment, so refer and avoid probe tests (IMM-01, INF-01). Fullness with a hearing change points to fluid or pressure in the middle ear, or to Ménière's."
        - do: "ENT history: ear surgery, treatment, scans; middle ear, throat and sinus problems."
          ask: ["Have you had any ear operations, grommets or scans?", "Any problems with your sinuses or throat?"]
          why: "After middle ear surgery, grafts and the reconstructed ossicles are still healing, and pressure changes could disturb them, so tympanometry waits (IMM-01). Old surgery or grommets can leave scarring (tympanosclerosis) or a thin, floppy eardrum, which explain an air-bone gap or an unusual tympanogram."
        - do: "Loud noise: occupational or recreational, hearing protection."
          ask: ["Have you worked anywhere noisy?", "Do you shoot, ride motorbikes, or play or listen to loud music?", "Did you wear hearing protection?"]
          why: "Noise damages outer hair cells most in the region tuned to about 3–6 kHz, partly because the ear canal's resonance boosts sound there, giving the typical 4 kHz notch. The damage is permanent, so prevention advice matters. A right-handed shooter's left ear is nearer the muzzle and is usually worse, which can explain an asymmetry, but refer anyway if it meets the NZ criteria."
        - do: "Family history: relatives, age of onset, cause."
          ask: "Does anyone in your family have hearing loss? How old were they when it started?"
          why: "Early-onset loss in the family suggests a genetic cause. In otosclerosis, for example, abnormal bone growth gradually fixes the stapes, giving a conductive loss that often appears in early adulthood. Knowing the pattern helps you predict and counsel about progression."
        - do: "General health: illnesses, medications, hospital stays, head or ear injury, memory, past infections."
          ask: ["Any major illnesses or hospital stays?", "What medicines do you take?", "Have you ever had a head injury?", "Any concerns about your memory?"]
          why: "Some medicines are toxic to the outer hair cells, starting at high frequencies: aminoglycoside antibiotics and cisplatin chemotherapy are the main ones. A head injury can fracture the temporal bone, disrupt the ossicles or concuss the cochlea. Memory concerns change how you instruct, test and counsel."
  figures: [adult-history-form]
  notes:
    - kind: flag
      text: Sudden hearing loss, unilateral tinnitus, or dizziness with neurological signs are red flags. See CLS-02 before the patient leaves.
  sim:
    name: history-taking simulator
    url: https://jakalnz.github.io/history-taking-simulator/
    label: Practise hypothesis-led questioning
  fixes: []

- id: OTO-01
  title: Do otoscopy
  mode: READ-DO
  source: "3"
  purpose: Check the ear canal and eardrum before any test, and decide whether testing or referral comes first.
  blocks:
    - title: Look
      steps:
        - do: Brace your hand against the patient's head before inserting the speculum.
          why: "Bracing means the speculum moves with the head if the patient moves, so it cannot jab the canal."
          watch: "Rest the side of your hand on the head, not just a fingertip."
        - do: Check the outer ear.
          why: "A scar behind the ear suggests previous mastoid surgery, which changes your choice of transducer (PTA-02)."
        - Check the canal for wax, foreign bodies, discharge, disease and collapsing canals.
        - do: Check the eardrum for perforations and other changes.
          eg: "Perforation, grommet, retraction, a fluid level or bubbles, redness or bulging."
        - do: Record findings in the otoscopy section of the audiogram.
          eg: "\"R: canal clear, TM intact. L: wax covering about half the canal, TM partly visible.\""
      pod: [bsa-speculum]
    - title: Repeat
      steps:
        - Look again if inserts cause discomfort, to check for skin abrasion.
    - title: Refer for wax removal when there is a significant wax plug
      steps:
        - The plug covers more than half the canal diameter.
        - Or you cannot see the eardrum past it.
        - Or it would block an insert earphone or stop an immittance or OAE probe sealing.
        - "Refer directly to a wax-removal provider, or give the patient details so they can book one themselves."
        - "If you test anyway, record the wax and any change to the test (e.g. supra-aural headphones) on the audiogram."
      why: A plug blocking most of the canal can add a conductive loss and stop inserts and probes working, so the results would not show the patient's true hearing. Small amounts of wax that leave the canal open and the eardrum visible do not need removing.
      pod: [wax-nzas, wax-bsa]
    - title: Refer for other abnormal findings
      steps:
        - "Refer to a GP or ENT for findings such as otitis externa, discharge, a foreign body or a new perforation."
  values:
    - caption: Words to use for common findings
      source: March 2026 Table 1
      header: ["Finding"]
      rows:
        - ["Clear canals; TM intact / NAD"]
        - ["Slight non-occluding wax; TM visible"]
        - ["Occluding wax; TM not visible"]
        - ["TM scarring"]
        - ["TM perforation"]
        - ["Patent grommet / grommet in situ"]
  notes:
    - kind: stop
      text: Do not insert a speculum, probe or insert earphone into a discharging ear.
  sim:
    name: otoscopy simulator
    url: https://jakalnz.github.io/otoscopy/
    label: Identify findings and choose the right description
  media_planned:
    - "Photo set: one example of each finding in the table"
    - "Video: bracing technique for otoscopy (30 s)"
  check:
    - q: Wax covers about two-thirds of the canal but you can see part of the eardrum. Refer?
      a: "Yes. A plug covering more than half the canal diameter is a significant wax plug, even if part of the eardrum is visible. Refer for wax removal, and record the wax on the audiogram if you go ahead with testing."
  fixes:
    - "Bracing added from Section 14 (safety errors: failure to brace for otoscopy)."
    - "Stop note on discharging ears added from the transducer and immittance contraindications."
    - "Wax referral rewritten around a significant wax plug. March 2026 listed \"shallow, hard, or centrally situated\" wax; these were unclear and are removed (MS, 1 Nov 2026)."
    - "Referral for other abnormal findings (GP or ENT) split out from wax referral."

differences:
  wax-nzas:
    title: When wax needs removing (NZ)
    label: NZAS PTA BPG (2021) 4.2.1
    cards: OTO-01
    ours: "Refer for a significant plug: more than half the canal, eardrum hidden, or it would block an insert or probe."
    bpg: "Test on clear canals where possible. Partial occlusion: use headphones rather than inserts. Full occlusion: refer to have the canal cleared."
    why: "The NZAS refers only for full occlusion; our wording refers earlier. Agree which threshold we teach."
    status: To confirm (MS)
  wax-bsa:
    title: When wax needs removing (international)
    label: BSA Aural Care (2025); AAO-HNSF (2017)
    cards: OTO-01
    ours: "Refer for a significant plug, judged mainly by how much of the canal it blocks."
    bpg: "Removal is needed when wax hides the eardrum or canal, causes a blocked feeling or other symptoms, reduces hearing, prevents a test or procedure (hearing test, tympanometry, impressions, probe-microphone measures), or interferes with a hearing aid. AAO-HNSF: impaction = wax causing symptoms or preventing an examination."
    why: "International guidance defines need by effect and symptoms, not size. Consider adding symptoms to the card."
    status: To discuss
  bsa-speculum:
    title: Otoscopy hygiene and order (international)
    label: BSA Ear Examination (2022)
    cards: OTO-01
    ours: "No guidance on speculum use between ears or which ear to examine first."
    bpg: "Use a different speculum for each ear and never reuse one between people (disposables preferred). Examine the ear least likely to be abnormal first."
    why: "Simple infection-control step worth adding to the card."
    status: To discuss
