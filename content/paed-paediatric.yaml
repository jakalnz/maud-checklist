module:
  id: paed
  order: 8
  title: Paediatric testing
  owner: ""
  source: "12–13"
  standard: "NZ standard: UNHSEIP Diagnostic and Amplification Protocols (Oct 2023). ≠ marks where UoA teaching differs."

cards:

- id: VRA-01
  title: Set up for VRA
  mode: DO-CONFIRM
  source: "12, 12.1.1.1, 12.1.2.1"
  purpose: Prepare the room, equipment and seating so VRA can start the moment the child settles (about 6 to 30 months).
  when:
    - The UNHSEIP Diagnostic and Amplification Protocols (Oct 2023) are the NZ standard for paediatric assessment and take precedence over these cards. ≠ marks where UoA teaching differs.
  blocks:
    - title: Audiometer and room
      steps:
        - "Select the speaker, stimulus (usually NBN), first frequency (usually 500 Hz) and 30 dB HL."
        - Switch on the amplifier and loop, or the remote microphone, and check two-way communication.
        - Turn on the talkback monitor or wear the headset.
        - Listen in the room to check the signal.
        - Place the child's chair on the calibrated spot.
    - title: Seating
      steps:
        - "Under about 18 months: child on the parent's lap, distracter on a full-size chair in front."
        - "From about 18 months: child at the small table, parent close by on the side away from the speaker and reinforcer."
        - do: Distracter sits opposite the child, slightly to one side, so the tester can see the child.
          why: "The tester judges each turn from the child's face and eyes, so needs a clear view."
        - do: Reinforcer box sits at 45–90° from the child.
          why: "A turn of 45–90° away from the distracter is a clear, deliberate movement. A reinforcer straight ahead gives turns you cannot judge."
      why: Some clinics are calibrated separately for the lap and the small chair. Check how yours was calibrated.
    - title: Calibrate live voice
      steps:
        - Select microphone and speaker, and put the headset on.
        - With the interrupt on and the dial at −10 dB HL, talk normally and set the mic so your voice peaks at 0 VU.
        - Recalibrate if you move or adjust the headset.
      why: The interrupt and −10 dB HL setting stop the child hearing you while you calibrate.
  media_planned:
    - "Photo: room layout from above, with the calibrated spot, speaker, reinforcer, distracter and parent marked"
  fixes: []

- id: VRA-02
  title: Find thresholds with VRA
  mode: READ-DO
  source: "12.1.1.2, 12.1.2.2, 12.1.3"
  purpose: Get a speech detection threshold, then frequency-specific thresholds, using a conditioned head turn.
  blocks:
    - title: Speech detection threshold (live voice)
      steps:
        - do: "At 30 dB HL, call the child naturally (\"Hi Emily, I'm over here\"). Reinforce a head turn."
          why: "Their own name in a familiar-sounding voice is the most engaging sound, so it is the easiest first response, and it starts teaching the head turn."
        - do: Get a second turn at 30 dB HL, with the interrupt off between calls.
          why: One turn can be chance. A second turn at the same level shows the child is responding to the sound.
        - Drop to 20 dB HL and get two turns for a screening SDT.
        - do: No turn at 30 dB HL? Go up in 20 dB steps until they respond, then find threshold.
          why: Large steps find a response quickly, before the child loses interest. You then refine it.
        - do: Still no spontaneous turn? Pair sound and reinforcer until the child is conditioned.
          why: "Pairing teaches the child that the sound predicts the toy lighting up, so they learn to look for it when they hear the sound alone."
    - title: Frequency-specific, sound field
      steps:
        - Present 500 Hz NBN at 30 dB HL and reinforce a head turn. Repeat once.
        - Drop to 20 dB HL and get two reliable turns.
        - do: Repeat at 2 kHz, 4 kHz, then 1 kHz.
          why: Children habituate quickly. Getting a low and a high frequency first means even a short test shows the shape of the audiogram.
        - No response after two at 30 dB HL? Go up in 20 dB steps (two presentations each) to 50 then 70 dB HL, then find threshold.
        - No response at 70 dB HL? Pair stimulus and reinforcer to condition. Still none? Move to bone conduction.
      pod: [vra-normal, bsa-vra-stimulus, bsa-vra-levels, vra-threshold-search, vra-conditioning]
    - title: Bone conduction
      steps:
        - Switch early to BC if sound-field results are unreliable and suggest a loss.
        - Place the bone conductor on the mastoid nearest the speaker.
        - do: Condition with 500 Hz NBN at 40 dB HL (felt as vibration), paired with the reinforcer.
          why: At 500 Hz the bone conductor is felt as well as heard, so a child with a hearing loss can still learn the task.
        - do: Do not start BC at 2 kHz.
          why: "Part of bone conduction travels through the ossicles, and that part peaks around 2 kHz. Middle ear fluid or stiffness reduces it, so bone conduction looks worse at 2 kHz than the cochlea really is (the Carhart notch). If 2 kHz is your only BC threshold, a conductive loss can look sensorineural."
      pod: [vra-bc]
    - title: Ear-specific (inserts)
      side: true
      steps:
        - Start with the ear nearest the reinforcer, unless history or immittance suggests it is the poorer ear.
        - Start at 30 dB HL and reduce to 20 dB HL.
        - do: Get 500 Hz, 2 kHz, 4 kHz and 1 kHz before changing ears.
          why: Moving the earphone disturbs the child. Finish one ear while they are still engaged.
        - No responses down to 20 dB HL? Test bone conduction.
      pod: [vra-inserts-first, vra-required-tests]
  notes:
    - kind: rule
      text: "If unsure whether a turn was real, do not reinforce. Reinforcing a false turn teaches searching and can pass a child with a hearing loss."
    - kind: note
      text: "Sound-field results normal? Get ear-specific evidence from DPOAEs, and do immittance with reflexes in each ear to exclude ANSD. Sound field shows a loss? Book more testing for ear-specific thresholds before any hearing aid fitting."
    - kind: note
      text: "After 2–3 unsuccessful VRA attempts, move promptly to another method, such as ABR under general anaesthetic."
  sim:
    name: play audiometry simulator
    url: https://jakalnz.github.io/play-audiometry/
    label: Practise conditioning and threshold search with a simulated child
  fixes:
    - "Heading numbering corrected (12.2.2.2 appeared inside 12.1.1)."
    - "\"come and fine me\" corrected."
  refs:
    - "Gravel, J. S. (1994). Auditory assessment of infants. Seminars in Hearing, 15(2), 100–113."

- id: VRA-03
  title: Work as tester and distracter
  mode: DO-CONFIRM
  source: "12.1.4–12.1.6"
  purpose: Share the work between two testers so every head turn is judged fairly and the child stays engaged.
  blocks:
    - title: Tester (case manager)
      steps:
        - Introduce yourselves and seat everyone.
        - Take the history and explain the test. Ask the parent not to cue the child.
        - do: Present stimuli with varied gaps between them.
          why: "Children learn rhythms quickly and turn by habit, which gives false responses."
        - Decide with the distracter whether each turn was real; reinforce only clear turns.
        - Tell the distracter the stimulus and level, but not just before presenting.
        - do: Change reinforcers and stimuli (NBN or warble) to keep interest.
          why: "Infants habituate: the same reward loses its pull after a few trials. Novelty restores the response."
        - do: Record every presentation and response (✓ or +, and −).
          why: "Recording the no-response trials, and the turns when nothing was played, lets you judge how reliable the responses were."
        - Do at least one cross-check and immittance.
        - Give brief feedback after each test, then manage the case and refer as needed.
    - title: Distracter
      side: true
      steps:
        - Engage the child during the history.
        - do: Keep the child's attention forward, without over-engaging them.
          watch: "An over-engaged child will not turn; an under-engaged child keeps looking around and gives false turns."
        - Change toys or how you use them to set the right level of distraction.
        - Praise the child when they respond.
        - Fit the bone conductor or inserts.
        - Tell the tester whether you thought a turn was real, and if a false turn was reinforced.
      why: Telling the distracter the level just before a presentation cues them, and they may cue the child.
  notes:
    - kind: note
      text: "UNHSEIP: hand puppets should not be used by the distracter, as the tester cannot see the child's face. The distracter can be an audiometrist, AoDC or parent if needed."
  fixes: []

- id: CPA-01
  title: Prepare for play audiometry and use the Kendall Toy Test
  mode: DO-CONFIRM
  source: "12.2.1–12.2.3"
  purpose: Get the key history quickly, then use the KTT to engage the child and check speech hearing (about 30 months to 5 years).
  blocks:
    - title: Quick history first
      steps:
        - do: Main concerns about hearing.
          ask: "What worries you most about their hearing?"
        - do: Speech and language development.
          ask: "How many words is she using? Is she putting two words together?"
        - do: History of middle ear disease.
          ask: ["How many ear infections in the last year?", "Has he had grommets?"]
          why: "Middle ear fluid is the most common cause of hearing loss at this age. It comes and goes, so a history of infections tells you to look closely at tympanometry and bone conduction."
        - Fill in the rest of the Child History Form during or after testing.
      why: You have limited time before attention fades. The full form covers age, referral, responsiveness, speech and language, ear infections, risk factors (pregnancy and birth, family history, major illness, craniofacial differences) and development.
    - title: Prepare
      steps:
        - Get forms, including the KTT score sheet.
        - Set out the KTT, sound level meter, loudspeaker and play toys.
        - Do listening checks.
        - do: Practise producing 35 and 45 dBA with your voice.
          why: "You will speak at these levels with the meter out of the child's view. An inconsistent voice level makes the result meaningless."
    - title: Kendall Toy Test
      steps:
        - do: Take toys out one at a time and ask the child to name them; name it if they do not.
          why: "The test measures hearing, not vocabulary. A child who does not know the word \"spoon\" cannot pick the spoon."
        - Spread the toys on the table.
        - do: Practise with the 5 distracter items at normal voice ("Show me the ...").
          why: "They teach the task at an easy level, so later misses are about hearing."
        - Drop to 35–40 dBA and ask for each of the 10 test items in random order.
        - If an item is missed, raise your voice 5–10 dB until it is found.
        - "Record the dBA level at which ≥ 90% of items are found, e.g. 9/10 at 40–45 dBA."
      pod: [ktt-pass]
  notes:
    - kind: note
      text: "Be quick and positive. If the child picks the wrong toy, say \"Yes, that's the bath, and here's the car.\" Hide your lips, and make sure errors come from hearing, not attention."
  figures: [child-history-form]
  fixes: []

- id: CPA-02
  title: Find thresholds with play audiometry
  mode: READ-DO
  source: "12.2.4"
  purpose: Teach a play response, then find thresholds quickly, at the frequencies that matter most for speech.
  blocks:
    - title: Condition
      steps:
        - do: "Tell, do not ask: \"We are going to play a game.\""
          why: "Asking a young child if they want to play invites \"no\"."
        - Condition with loud tones through a speaker or headphones on the table.
        - do: Under 4 years, demonstrate without words.
          why: "Under about 4, spoken instructions are often not understood, but children readily copy what they see."
        - Get a few clear responses before putting headphones on the child.
    - title: Test air conduction
      steps:
        - do: "Order: 2 kHz, 500 Hz, 4 kHz, 1 kHz (1 kHz before 4 kHz if you suspect a U-shaped loss)."
          why: "2 kHz carries much of the consonant information in speech, so it is the most useful single frequency if the child stops early."
        - do: Get at least 2 kHz and 500 Hz in one ear before switching, if attention is fading.
          why: "One low and one high frequency in each ear is the minimum to show whether there is a loss and roughly its shape."
        - First frequency at 50 dB HL; if clear, drop to 30 then 20 dB HL.
        - Later frequencies start at 30 dB HL.
        - Bracket down to 10 dB HL. From 3½ to 4 years, if cooperative, find true thresholds.
      pod: [cpa-start, vra-normal]
    - title: If things get hard
      steps:
        - Headphones refused? Try inserts, a hand-held headphone with enough pressure, or the speaker.
        - Change the game when interest drops, but keep instructions the same.
        - Try headphones again later.
    - title: Bone conduction and masking
      steps:
        - do: Test BC if a loss is suspected. Do not start at 2 kHz.
          why: "Middle ear fluid or stiffness lowers bone conduction around 2 kHz (the Carhart notch), so starting there can make a conductive loss look sensorineural (see VRA-02)."
        - Screen BC to 0 dB HL, or far enough to confirm or rule out a conductive component.
        - Mask if needed and the child is still attending; use the step method.
        - Give a short explanation to the parent before immittance.
      pod: [cpa-bc-screen, vra-required-tests]
  sim:
    name: play audiometry simulator
    url: https://jakalnz.github.io/play-audiometry/
    label: Run a full CPA session with a simulated child
  fixes:
    - "\"simplist\" corrected."

- id: PIM-01
  title: Do paediatric tympanometry
  mode: READ-DO
  source: "13.1, 13.2"
  purpose: Choose the right probe tone for the child's age and classify against the right norms.
  blocks:
    - title: Seat the child
      steps:
        - do: "Under about 2½ years: on the parent's lap facing away from the meter, distracter in front with hands-busy toys."
          why: "Seeing the probe and meter worries some children. Facing away with busy hands means less movement and fewer lost seals."
        - Older children can sit alone and watch, but will need something to hold.
    - title: Under 9 months corrected age
      steps:
        - do: "Probe tone 1 kHz, pressure +200 to −600 daPa, baseline correction off."
          why: "An infant's ear canal walls are soft and move with the pressure change. At 226 Hz that movement dominates, so the trace can look normal with fluid behind the eardrum. At 1 kHz the canal walls matter less and the trace reflects the middle ear."
        - "Classify as peaked (single or double peak), flat (no peak) or indeterminate (any other shape)."
        - Repeat if the trace is noisy or not clearly normal.
      pod: infant-baseline
    - title: 9 months and over
      steps:
        - do: Use 226 Hz in diagnostic (manual) mode at 600/200 daPa/s.
          why: "By about 9 months the canal walls are firm enough for 226 Hz to reflect the middle ear, and the familiar norms apply."
        - Use manual rather than screening mode.
        - Classify with the norms in the table.
      why: "Screening mode is fast but loses accuracy on ambiguous traces, starts without your control, and needs the probe removed and reinserted every time the seal is lost. Manual mode at a fast sweep is almost as quick."
  values:
    - caption: Paediatric norms
      source: ASHA (1997); UNHSEIP (2023)
      header: ["Measure", "Infant", "1 yr to school"]
      rows:
        - ["Admittance (mmho)", "0.2–1.4", "0.3–1.4"]
        - ["Peak pressure (daPa)", "−100 to +100", "−100 to +100"]
        - ["TW (daPa)", "< 235", "< 200"]
        - ["ECV pre-tube (cm³)", "0.3–0.9", "0.3–0.9"]
        - ["ECV post-tube (cm³)", "1.0–5.5", "1.0–5.5"]
  sim:
    name: immittance simulator
    url: https://jakalnz.github.io/immittance-simulator/
    label: Classify infant 1 kHz and child 226 Hz tympanograms
  fixes:
    - "UNHSEIP reference updated from 2016 to the October 2023 edition; protocol unchanged."

- id: PIM-02
  title: Measure paediatric acoustic reflexes
  mode: READ-DO
  source: "13.3"
  purpose: Show reflex presence or absence at a safe level, as a cross-check on hearing and middle ear status.
  blocks:
    - title: Under 9 months corrected age
      steps:
        - Use a 1 kHz probe tone and BBN at 85 dB HL, ipsilateral.
        - Get two replications to call it present; check for growth.
        - do: Do not go above 85 dB HL.
          why: "An infant's ear canal is very small, so the same dial setting gives a much higher sound level at the eardrum than in an adult."
        - Keep printouts of any ambiguous record.
      why: Most babies have a BBN reflex at or below 85 dB HL, so absence at 85 dB HL is abnormal. Positive deflections are normal with a 1 kHz probe.
    - title: 9 months and over (226 Hz probe)
      steps:
        - "Normal tympanogram: find at least one ipsilateral threshold from 1 kHz; add 500 Hz, 2 kHz and contralateral if the child cooperates."
        - do: "Ambiguous type C: find a 1 kHz ipsilateral threshold from about 90 dB HL, up to 105 dB HL."
          why: "Negative middle ear pressure stiffens the eardrum, which can raise a reflex or hide it, so you need higher levels to show it."
        - do: "Ambiguous As or rounded B: test for presence at 95 dB HL BBN or 105 dB HL at 1 kHz, unless there is a patent grommet or perforation."
          why: "A present reflex means the middle ear can transmit the stapedius movement to the probe, which argues against an effusion."
        - Use diagnostic, not screening, mode.
      pod: paed-art-start
      why: In screening mode, Sells et al. (1997) found a 31% false-positive rate for ipsilateral reflexes.
  notes:
    - kind: rule
      text: "A reflex is present if there is a clear deflection, repeatable at any stimulus level."
  fixes:
    - "March 2026 said UNHSEIP starts paediatric reflexes at 90 dB HL; UNHSEIP 2023 Appendix 7 says start at 80 dB HL, or one clear repeatable response at 90 dB HL if the child is active."

differences:
  vra-normal:
    title: Pass level and 1 kHz in VRA and CPA
    cards: VRA-02, CPA-02
    label: UNHSEIP (Oct 2023), NZ standard
    ours: "Normal is ≤ 15 dB HL; test down to 15 dB HL or lower. Test 1 kHz routinely."
    bpg: "Minimum test level defining normal hearing is 20 dB HL (VRA, and CPA for 500 Hz–4 kHz). 1 kHz is tested only where indicated by the shape of the audiogram (discretionary if 500 Hz and 2 kHz differ by < 30 dB). International guidance agrees: BAA/BSA (2024) and BSA VRA (2025) use ≤ 20 dB HL under earphones, ≤ 25 dB HL in sound field."
    why: "UoA teaching variation (lower pass level). Students must use 20 dB HL when working to the UNHSEIP protocol."
    status: UoA variation; confirm
  vra-inserts-first:
    title: Ear-specific testing from the start
    cards: VRA-02
    label: UNHSEIP (Oct 2023), NZ standard
    ours: "Start in the sound field; use inserts for ear-specific thresholds when possible."
    bpg: "Begin with insert earphones in both ears and test the ear nearest the reinforcer first. Initial assessments need ear-specific thresholds at 2 kHz, 500 Hz and 4 kHz. Sound field is acceptable, but normal sound-field results must be backed by DPOAEs and immittance in each ear. Inserts are mandatory for AC VRA in infants with permanent hearing loss."
    why: "Not a minor variation: UNHSEIP makes ear-specific testing the default. Recommend aligning VRA-02 with UNHSEIP."
    status: Recommend align
  vra-threshold-search:
    title: VRA threshold search
    cards: VRA-02
    label: UNHSEIP (Oct 2023), NZ standard
    ours: "After two responses at 30 dB HL, drop to 20 dB HL; otherwise use 'standard audiometric procedure' to find threshold."
    bpg: "After two consecutive head turns, search down 20 dB, up 10 dB. Threshold is the lowest level with 2 responses out of 3 presentations, or test down to 20 dB HL."
    why: "Ours does not state the step size. Recommend adopting the UNHSEIP 20-down 10-up search."
    status: Recommend align
  vra-conditioning:
    title: Conditioning when there is no head turn
    cards: VRA-02
    label: UNHSEIP (Oct 2023), NZ standard
    ours: "No response at 70 dB HL: pair sound and reinforcer; if still none, move to bone conduction."
    bpg: "At 70 dB HL pair twice, then present a probe. No turn: do a listening check, then try 90 dB HL (80 dB HL in sound field if the speaker distorts) paired twice, then a probe. Still none: change frequency, stimulus type, ear, or try bone conduction or sound field."
    why: "UNHSEIP goes to 90 dB HL before concluding. Recommend aligning."
    status: Recommend align
  vra-bc:
    title: Bone conduction in VRA
    cards: VRA-02
    label: UNHSEIP (Oct 2023), NZ standard
    ours: "Bone conductor on the mastoid nearest the speaker; condition with 500 Hz at 40 dB HL (vibrotactile)."
    bpg: "Test BC for at least one frequency where AC is > 20 dB HL in both ears. Under 1 year, place it on the mastoid of the better AC ear (interaural attenuation for BC is still 15–25 dB at this age); older children and CPA, the worse ear. Start at or below the AC threshold and test down to 20 dB HL."
    why: "Placement rule differs and is evidence-based. Recommend aligning; the vibrotactile conditioning tip can stay as a PTF tip."
    status: Recommend align
  vra-required-tests:
    title: Tests required in every initial VRA or CPA assessment
    cards: VRA-02, CPA-02
    label: UNHSEIP (Oct 2023), NZ standard
    ours: "DPOAEs and immittance with reflexes in each ear when sound-field results are normal."
    bpg: "Every initial VRA assessment: otoscopy; ear-specific AC at 2 kHz, 500 Hz, 4 kHz (+1 kHz if indicated); ear-specific speech detection thresholds by live voice; BC if indicated; DPOAEs at 1.5, 2, 3, 4, 6 kHz; tympanometry and ipsilateral 1 kHz reflex (226 Hz probe, or 1 kHz probe under 9 months). CPA: the same, with the Kendall Toy Test recommended. Sound-field CPA is acceptable only after a documented, failed effort to get ear-specific results."
    why: "Recommend adding this battery to VRA-02 and CPA-02 as a checklist."
    status: Recommend align
  cpa-start:
    label: UNHSEIP (Oct 2023), NZ standard
    title: CPA starting and test levels
    cards: CPA-02
    ours: "First frequency at 50 dB HL, then 30 and 20; bracket down to 10 dB HL; from 3½–4 years find true thresholds."
    bpg: "Condition with 2 kHz at about 110 dB HL (headphones on the table) or 70 dB HL via speaker. Start at 30 dB HL with a repeat, then 20 dB HL with a repeat; later frequencies one response at 30, then 20 dB HL. No response: up in 20 dB steps. Down 20 up 10, or 10/5 if cooperative."
    why: "UoA teaching variation, documented in March 2026. Starting at 50 dB HL is a gentler first step; testing below 20 dB HL is optional under UNHSEIP."
    status: UoA variation; confirm
  cpa-bc-screen:
    label: UNHSEIP (Oct 2023), NZ standard
    title: CPA bone conduction
    cards: CPA-02
    ours: "Test BC if a loss is suspected; screen to 0 dB HL."
    bpg: "Test BC if AC is > 20 dB HL; test down to 20 or 10 dB HL depending on the child's attention."
    why: "UoA teaching variation (lower screening level), documented in March 2026."
    status: UoA variation; confirm
  ktt-pass:
    title: Kendall Toy Test pass level and method
    cards: CPA-01
    label: UNHSEIP (Oct 2023), NZ standard
    ours: "Start at 35–40 dBA, raise 5–10 dB; record the level for ≥ 90% correct. Practise with all 5 distracter items."
    bpg: "Pass level 40 dBA (≥ 90%), raised from the original 35 dBA to match the 20 dB HL screening level. Raise in 10 dB steps. Practise with 2–3 distracter items. Live voice (sound level meter on fast, dBA, at the child's head) or the SPANZ recording; audiometer equivalents of 40 dBA: inserts 27.5, supra-aural 20, speaker 25.5 dB HL (round down to 5 dB). A picture-card version is acceptable."
    why: "Add the 40 dBA pass level and audiometer equivalents to CPA-01. Our lower start is a UoA variation."
    status: Recommend align (pass level)
  infant-baseline:
    label: UNHSEIP (Oct 2023), NZ standard
    title: Drawing a baseline on infant 1 kHz tympanograms
    cards: PIM-01
    ours: "March 2026: print and draw a baseline from +200 to −400 daPa before classifying."
    bpg: "Record without baseline correction (+200 to −600 daPa) and classify the shape as peaked, flat or indeterminate; no hand-drawn baseline described."
    why: "Check whether the hand-drawn baseline is still taught."
    status: To confirm (MS)
  paed-art-start:
    label: UNHSEIP (Oct 2023), NZ standard
    title: Reflexes from 9 months
    cards: PIM-02
    ours: "Ambiguous C: start about 90 dB HL, up to 105 dB HL. Ambiguous As or rounded B: 95 dB HL BBN or 105 dB HL at 1 kHz."
    bpg: "Start at 80 dB HL (1 kHz, ipsilateral, 226 Hz probe), two replications; a single clear repeatable response at 90 dB HL is enough if the child is active. To confirm middle ear effusion, use BBN up to 90–95 dB HL. The goal is presence or absence at a safe level, not a threshold."
    why: "March 2026 misquoted UNHSEIP as starting at 90 dB HL. Recommend the 80 dB HL start."
    status: Recommend align
  bsa-vra-stimulus:
    title: VRA stimulus (international, for detail only)
    label: BSA VRA (2025); Ontario IHP (2019)
    cards: VRA-02
    ours: "Usually narrowband noise (NBN), alternating with warble tones."
    bpg: "BSA prefers FM warble tones because NBN is less frequency specific. UNHSEIP allows pulsed NBN, FRESH noise or FM warble tones, so our practice meets the NZ standard."
    why: "UNHSEIP takes precedence. Useful background on why warble tones may be more accurate."
    status: For information
  bsa-vra-levels:
    title: VRA starting level (international, for detail only)
    label: BSA VRA (2025)
    cards: VRA-02
    ours: "Start at 30 dB HL and work up if needed (as UNHSEIP)."
    bpg: "BSA conditions at about 65 dB HL and descends in 20 dB steps, testing to 25 dB HL in sound field and 20 dB HL under earphones."
    why: "UNHSEIP takes precedence; our 30 dB HL start matches it."
    status: For information
