# ---------------------------------------------------------------- Points of difference
differences:
  insert-depth:
    title: Insert depth for the insert IAA values
    ours: "Use insert IAA and OEF values when the foam tip is at intermediate (flush) depth or deeper."
    bpg: "NZAS BPG Adult PTA (2021) says insert values apply only when the insert is inserted deeply; otherwise use supra-aural values."
    why: "Flush (intermediate) depth is achievable and comfortable for most adults; deep insertion is often uncomfortable. To confirm: the rationale and the evidence for IAA at intermediate depth."
    status: To confirm (MS)
  oef-depth:
    title: Insert depth for occlusion effect factors
    ours: "Insert OEFs (10, 10, 0 dB) apply at intermediate depth or deeper."
    bpg: "NZAS BPG Adult PTA (2021): insert OEFs apply only when the insert is inserted deeply."
    why: "As for IAA. To confirm."
    status: To confirm (MS)
  threshold-definition:
    title: Threshold definition
    ours: "Lowest level with responses on at least 2 of 3 presentations (March 2026 did not say ascending; this draft adds it)."
    bpg: "NZAS BPG (2021): responses on at least half of ascending trials, with a minimum of 2 of 3 ascending presentations."
    why: "Wording difference only. This draft aligns with the BPG."
    status: Aligned in draft
  retest:
    title: Reliability retest criterion
    ours: "Retest 1 kHz in one ear (no pass criterion given in March 2026)."
    bpg: "NZAS BPG (2021): if the retest differs by more than ±5 dB, retest other frequencies and cross-check with speech and immittance."
    why: "No reason recorded. Proposed: adopt the ±5 dB criterion."
    status: To confirm (MS)
  test-limit:
    title: Upper test limit
    ours: "Test up to the audiometer limit or 110 dB HL, whichever is lower."
    bpg: "NZAS BPG (2021): test to the maximum limit of the audiometer, monitoring comfort above 80 dB HL in 10 or 5 dB steps."
    why: "110 dB HL may be a comfort and safety limit for student clinics. To confirm."
    status: To confirm (MS)
  bc-criterion:
    title: When to test bone conduction
    ours: "Test bone conduction if air conduction shows a hearing loss."
    bpg: "NZAS BPG (2021): when air conduction thresholds are > 20 dB HL."
    why: "March 2026 does not define \"hearing loss\" here; elsewhere it uses > 15 dB HL as the limit of normal. To confirm which cut-off we teach."
    status: To confirm (MS)
