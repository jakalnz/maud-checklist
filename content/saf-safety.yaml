module:
  id: saf
  order: 9
  title: Safety and infection control
  owner: ""
  source: "14–15"

cards:

- id: SAF-01
  title: Avoid common safety errors
  mode: DO-CONFIRM
  source: "14"
  purpose: Check yourself against the errors that most often harm patients in audiology.
  blocks:
    - title: Testing and diagnosis
      steps:
        - do: "Mask when needed, and recognise undermasking."
          watch: "A threshold that keeps rising as masking rises means you have not reached the plateau yet. It is not a masked threshold."
        - "Use loud sounds (audiometry, reflexes, loudness discomfort testing) only when appropriate."
        - do: "Respect contraindications, e.g. a sweep rate too fast for comfort."
          eg: "No tympanometry within 3 months of middle ear surgery without ENT approval (IMM-01). No reflexes above 105 dB HL unless there is a conductive loss at that frequency (IMM-03)."
    - title: Follow-up and referral
      steps:
        - do: Ask the history questions that matter.
          eg: "Sudden onset, one-sided symptoms, dizziness, recent ear surgery, discharge."
        - Monitor and follow up.
        - "Act on red flags. Refer urgently (see CLS-02)."
    - title: Physical safety
      steps:
        - Brace your hand for otoscopy.
        - do: Never attempt wax removal you are not trained for.
          why: "Untrained wax removal can perforate the eardrum or damage the canal skin."
        - do: "Ear impressions: check the otoblock seal and avoid abrasion."
          why: "Impression material that gets past the otoblock can reach the eardrum and may need surgical removal."
        - Use good infection control (see INF-01).
    - title: Amplification
      side: true
      steps:
        - do: "Over-amplification: verify maximum output with real-ear measures to avoid pain or damage."
          why: "Output above the patient's discomfort level is painful and can cause further hearing loss."
        - "Under-amplification: verify targets so the patient has access to speech."
    - title: Communication and records
      side: true
      steps:
        - Document actions and information so others can see them.
        - Communicate clearly with the patient and other professionals.
  notes:
    - kind: stop
      text: "Possible stroke: sudden numbness or weakness of one side of the face, arm, leg or body; sudden confusion or trouble speaking; sudden vision loss; sudden trouble walking; sudden dizziness or loss of balance; sudden severe headache. Call 111."
  fixes:
    - "\"failure to ignore contraindications\" corrected to \"failure to respect contraindications\"."
    - "Table 14 turned into a checklist grouped by stage of the appointment."

- id: INF-01
  title: Clean and disinfect reusable tips
  mode: READ-DO
  source: "15"
  purpose: Clean reusable tips between patients so infection cannot pass from one ear to the next.
  when:
    - "Reusable: shiny otoscope tips, rubber OAE tips, rubber immittance tips."
    - "Throw away after one use: matte otoscope tips, foam OAE tips, foam insert tips, the plastic serviceable part of the OAE probe."
    - "Tips used on broken skin: throw away, or clean and autoclave."
  blocks:
    - title: You need
      side: true
      steps:
        - Two 1 L plastic containers with lids
        - A sieve
        - Baxter Enzy-Clean (enzymatic pre-soak)
        - Detergent
        - Milton tablets
    - title: Clean
      steps:
        - Collect tips from all clinic areas.
        - Add 1 teaspoon of Enzy-Clean to 1 L of warm water in a lidded container.
        - do: Add the tips, close the lid, shake, and soak for 2–3 minutes.
          why: "The enzyme breaks down wax and organic material, which would otherwise shield germs from the disinfectant."
        - Rinse thoroughly in warm water.
      why: Without Enzy-Clean, use detergent and hot water and follow the same steps.
      pod: [aaa-infection]
    - title: Disinfect
      steps:
        - Dissolve ¼ Milton tablet in 250 mL of cold water in the second container.
        - do: Add the tips, fully immersed and separated. Soak for no more than 1 hour.
          why: "Air bubbles and stacked tips leave surfaces the solution does not reach."
        - Drain with the sieve and dry on a clean paper towel.
        - Return dry tips to their workstations.
    - title: Tidy up
      steps:
        - Rinse and dry the containers.
        - Wipe the bench with detergent and pack away.
  notes:
    - kind: rule
      text: Make Milton solution fresh at least every second day, ideally daily.
  fixes:
    - "Disposable and reusable tip lists moved to the top of the card."

differences:
  aaa-infection:
    title: Infection control levels (international)
    label: AAA Infection Control; BSA Ear Examination (2022)
    cards: INF-01
    ours: "Enzymatic pre-soak, then Milton (hypochlorite) soak for reusable tips."
    bpg: "AAA: clean, then disinfect non-critical items (probe tips, specula, headphones); sterilise anything that contacts blood or ear drainage, such as wax loops and curettes. BSA: a separate speculum for each ear."
    why: "Our method suits non-critical tips. Add a line on items that need sterilising and on one speculum per ear."
    status: To discuss
